name: Build manifest

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'scripts/build-manifest.js'
      - '.github/workflows/build-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-manifest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build manifest
        run: node scripts/build-manifest.js

      - name: Commit manifest
        run: |
          if git diff --quiet manifest.json 2>/dev/null; then
            echo "No manifest changes — skipping commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: update asset manifest [skip ci]"
          git push
