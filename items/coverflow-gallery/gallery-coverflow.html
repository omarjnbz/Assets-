<title>Coverflow Gallery Test</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Martian+Mono:wght@300;400;500&display=swap">

<style>
:root{
  --ink:#080807;
  --ink-raise:#12110f;
  --ink-line:#2a2723;
  --sand:#e8e8e3;
  --sand-bright:#fafaf9;
  --sand-dim:#8b857c;
  --sand-ghost:#393632;
  --olive:#8c8c73;
  --olive-bright:#aaaa8e;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"Martian Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --gutter:clamp(1rem,4vw,3rem);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ink);color:var(--sand);
  font-family:var(--f-display);line-height:1.55;
  -webkit-font-smoothing:antialiased;
}

.banner{
  padding:.7rem var(--gutter);
  border-bottom:1px solid var(--ink-line);
  font-family:var(--f-mono);font-size:.55rem;
  letter-spacing:.2em;text-transform:uppercase;color:var(--olive);
  display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;
}
.banner span:last-child{color:var(--sand-ghost)}

.cf{
  position:relative;min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(1.4rem,3vw,2.2rem);
  padding:clamp(2rem,5vw,3.5rem) var(--gutter);
  overflow:hidden;
}
/* a warm wash instead of the original's purple/blue — it has to sit on the same ground as the rest of the work */
.cf::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 50% at 18% 12%,rgba(140,140,115,.16),transparent 70%),
    radial-gradient(55% 45% at 84% 78%,rgba(120,110,90,.13),transparent 70%);
}

.cf__head{position:relative;z-index:2;text-align:center;max-width:44ch}
.cf__eyebrow{
  margin:0 0 1rem;font-family:var(--f-mono);font-size:.56rem;
  letter-spacing:.24em;text-transform:uppercase;color:var(--olive);
}
.cf__head h1{
  margin:0;font-size:clamp(2rem,5.2vw,3.4rem);font-weight:800;
  line-height:1.02;letter-spacing:-.035em;text-wrap:balance;
}
.cf__head p{margin:.85rem 0 0;color:var(--sand-dim);text-wrap:balance}

/* ── deck ── */
.cf__stage{
  position:relative;z-index:2;width:100%;
  display:flex;align-items:center;justify-content:center;
  height:clamp(230px,44vh,420px);
}
.cf__deck{
  position:relative;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  perspective:1400px;
  touch-action:pan-y;
}
.cf__card{
  position:absolute;
  width:clamp(260px,42vw,560px);
  aspect-ratio:16/10;
  overflow:hidden;border-radius:14px;
  background:var(--ink-raise);
  border:1px solid rgba(232,232,227,.1);
  box-shadow:0 30px 70px -22px rgba(0,0,0,.9);
  text-decoration:none;color:inherit;
  transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.22,1,.36,1),
             opacity .55s ease, filter .55s ease;
  will-change:transform,opacity;
}
.cf__card img{
  position:absolute;top:0;left:0;
  width:100%;height:auto;display:block;
  transform:translateY(0);
  transition:transform .55s cubic-bezier(.22,1,.36,1);
  will-change:transform;
}
/* the front card plays its page top to bottom, the way it reads on the landing page */
.cf__card[data-center="true"] img{transition:transform 6s linear}
@media (prefers-reduced-motion:reduce){
  .cf__card img,.cf__card[data-center="true"] img{transition:none;transform:none!important}
}
.cf__card::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(200deg,rgba(255,255,255,.07),transparent 42%);
  pointer-events:none;
}
.cf__card:focus-visible{outline:2px solid var(--olive);outline-offset:5px}
.cf__card[data-center="true"]{cursor:pointer}
.cf__badge{
  position:absolute;left:.6rem;top:.6rem;z-index:2;
  font-family:var(--f-mono);font-size:.5rem;letter-spacing:.16em;
  color:var(--sand);opacity:.75;
}

.cf__nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:20;
  width:44px;height:44px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  background:rgba(8,8,7,.55);backdrop-filter:blur(8px);
  border:1px solid rgba(232,232,227,.18);
  color:var(--sand);
  transition:background .3s,border-color .3s,transform .3s;
}
.cf__nav:hover{background:rgba(8,8,7,.8);border-color:var(--olive)}
.cf__nav:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
.cf__nav--prev{left:clamp(.25rem,2vw,2rem)}
.cf__nav--next{right:clamp(.25rem,2vw,2rem)}
.cf__nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}

/* ── caption ── */
.cf__meta{
  position:relative;z-index:2;text-align:center;
  min-height:8.5rem;display:flex;flex-direction:column;
  align-items:center;gap:.4rem;
}
.cf__num{margin:0;font-family:var(--f-mono);font-size:.55rem;letter-spacing:.2em;color:var(--sand-ghost)}
.cf__sector{margin:0;font-family:var(--f-mono);font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--olive)}
.cf__name{margin:0;font-size:clamp(1.4rem,3.2vw,2.1rem);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.cf__visit{
  margin-top:.35rem;display:inline-flex;align-items:center;gap:.6rem;
  font-family:var(--f-mono);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--sand);text-decoration:none;padding-bottom:.35rem;
  border-bottom:1px solid var(--ink-line);
  transition:color .3s,border-color .3s,gap .3s;
}
.cf__visit:hover,.cf__visit:focus-visible{color:var(--olive-bright);border-color:var(--olive);gap:1rem}
.cf__fade{animation:cfIn .45s ease both}
@keyframes cfIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.cf__dots{position:relative;z-index:2;display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.cf__dot{
  width:7px;height:7px;border-radius:50%;padding:0;cursor:pointer;
  background:var(--sand-ghost);border:0;
  transition:background .3s,transform .3s;
}
.cf__dot[aria-current="true"]{background:var(--olive-bright);transform:scale(1.35)}
.cf__dot:focus-visible{outline:2px solid var(--olive);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  .cf__card{transition:none}
  .cf__fade{animation:none}
}
</style>

<div class="banner">
  <span>Gallery test — coverflow</span>
  <span>Not on the live site</span>
</div>

<section class="cf">
  <div class="cf__head">
    <p class="cf__eyebrow">Alternative gallery</p>
    <h1>Nine live builds</h1>
    <p>Each page plays top to bottom in front. Drag, arrow-key or swipe; clicking the front card opens the real site.</p>
  </div>

  <div class="cf__stage">
    <button class="cf__nav cf__nav--prev" type="button" aria-label="Previous project">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="cf__deck" id="deck" aria-roledescription="carousel"></div>

    <button class="cf__nav cf__nav--next" type="button" aria-label="Next project">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="cf__meta" id="meta" aria-live="polite"></div>
  <div class="cf__dots" id="dots"></div>
</section>

<script>
(function () {
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var P = [
    ["strip_arminak","Arminak Caravan","Commodity trading · Abu Dhabi","arminakcaravantrading.com","https://arminakcaravantrading.com/"],
    ["strip_ariana","Ariana Integrity","Real estate · Dubai","arianaintegrity.com","https://www.arianaintegrity.com/"],
    ["strip_nurelite","Nur Elite Properties","Real estate · Global","nurelite.properties","https://nurelite.properties/"],
    ["strip_ezarchi","EZ-ARCHI","AI copilot · Architecture","ez-archi.vercel.app","https://ez-archi.vercel.app"],
    ["strip_locals","Locals District","Festival microsite","locals-district.vercel.app","https://locals-district.vercel.app"],
    ["strip_unheard","UNHEARD 2.0","Festival · Rishikesh","unheard-f.vercel.app","https://unheard-f.vercel.app/"],
    ["strip_jinie","Jinie Bhatnagar","Artist portfolio · Music","Jinie-Portfolio","https://omarjnbz.github.io/Jinie-Portfolio/"],
    ["strip_kash","KAS5H","Artist press kit · Music","kas-5-h.vercel.app","https://kas-5-h.vercel.app/"],
    ["strip_bngeva","EVA","Voice AI · Live demo","bng-eva.vercel.app","https://bng-eva.vercel.app"]
  ];

  var deck = document.getElementById("deck");
  var meta = document.getElementById("meta");
  var dots = document.getElementById("dots");
  var n = P.length;
  var current = 2; /* Nur Elite leads */
  var cards = [];

  P.forEach(function (p, i) {
    var a = document.createElement("a");
    a.className = "cf__card";
    a.href = p[4];
    a.target = "_blank";
    a.rel = "noopener";
    a.setAttribute("aria-label", "Open " + p[1] + " in a new tab");
    a.innerHTML = '<span class="cf__badge">' + String(i + 1).padStart(2, "0") + "</span>" +
                  '<img src="img/' + p[0] + '.jpg" alt="' + p[1] + ' — full page design" loading="lazy">';
    deck.appendChild(a);
    cards.push(a);

    var d = document.createElement("button");
    d.className = "cf__dot";
    d.type = "button";
    d.setAttribute("aria-label", "Show " + p[1]);
    d.addEventListener("click", function () { go(i); });
    dots.appendChild(d);
  });

  /* how far round the ring each card sits from the one in front */
  function offset(i) {
    var d = i - current;
    if (d > n / 2) d -= n;
    if (d < -n / 2) d += n;
    return d;
  }

  /* how far each page can travel inside its card */
  function travelOf(card) {
    var img = card.querySelector("img");
    if (!img || !img.naturalWidth) return 0;
    var rendered = card.clientWidth * (img.naturalHeight / img.naturalWidth);
    var t = card.clientHeight - rendered;
    return t < -12 ? t : 0;
  }

  function layout() {
    cards.forEach(function (card, i) {
      var pos = offset(i);
      var abs = Math.abs(pos);
      var visible = abs <= 2;
      var scale = abs === 0 ? 1 : abs === 1 ? 0.84 : 0.7;
      var opacity = abs === 0 ? 1 : abs === 1 ? 0.45 : 0.18;

      card.style.transform =
        "translateX(" + pos * 52 + "%) scale(" + scale + ") rotateY(" + pos * -12 + "deg)";
      card.style.opacity = visible ? opacity : 0;
      card.style.filter = abs === 0 ? "none" : "blur(" + (abs * 2.5) + "px) grayscale(.35)";
      card.style.zIndex = String(20 - abs);
      card.style.visibility = visible ? "visible" : "hidden";
      card.setAttribute("data-center", abs === 0 ? "true" : "false");
      card.tabIndex = abs === 0 ? 0 : -1;
      /* only the front card should be clickable — the others are scenery */
      card.style.pointerEvents = abs === 0 ? "auto" : "none";

      var img = card.querySelector("img");
      if (img) {
        /* front card plays its page; the rest sit back at the top */
        img.style.transform = abs === 0 ? "translateY(" + travelOf(card) + "px)" : "translateY(0)";
      }
    });

    var p = P[current];
    meta.innerHTML =
      '<p class="cf__num">' + String(current + 1).padStart(2, "0") + " / 0" + n + "</p>" +
      '<p class="cf__sector">' + p[2] + "</p>" +
      '<h2 class="cf__name">' + p[1] + "</h2>" +
      '<a class="cf__visit" href="' + p[4] + '" target="_blank" rel="noopener">' + p[3] + " <span>↗</span></a>";
    if (!reduced) meta.firstChild.parentNode.classList.add("cf__fade");

    Array.prototype.forEach.call(dots.children, function (d, i) {
      d.setAttribute("aria-current", i === current ? "true" : "false");
    });
  }

  function go(i) { current = ((i % n) + n) % n; layout(); }
  function next() { go(current + 1); }
  function prev() { go(current - 1); }

  document.querySelector(".cf__nav--next").addEventListener("click", function () { next(); hold(); });
  document.querySelector(".cf__nav--prev").addEventListener("click", function () { prev(); hold(); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { next(); hold(); }
    if (e.key === "ArrowLeft") { prev(); hold(); }
  });

  /* drag / swipe */
  var down = null;
  deck.addEventListener("pointerdown", function (e) { down = e.clientX; hold(); });
  window.addEventListener("pointerup", function (e) {
    if (down === null) return;
    var dx = e.clientX - down;
    if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); }
    down = null;
  });

  /* gentle auto-advance, but it yields the moment anyone touches it */
  var timer = null, paused = false;
  function tick() { if (!paused) next(); }
  function start() { if (!reduced && !timer) timer = setInterval(tick, 6500); }
  function stop() { clearInterval(timer); timer = null; }
  function hold() { stop(); setTimeout(start, 9000); }

  deck.addEventListener("mouseenter", function () { paused = true; });
  deck.addEventListener("mouseleave", function () { paused = false; });
  document.addEventListener("visibilitychange", function () {
    document.hidden ? stop() : start();
  });

  layout();
  cards.forEach(function (c) {
    var img = c.querySelector("img");
    if (img && !img.complete) img.addEventListener("load", layout);
  });
  window.addEventListener("resize", layout);
  start();
})();
</script>
